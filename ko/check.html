<h1>팝업 차단 확인</h1>
<p class="lead">Safari에서 이 페이지를 연 것만으로 확인이 끝나요. Unpop 팝업 차단을 켜고 모든 웹사이트를 허용했다면 방금 이 페이지에서 실행됐어요.</p>
<p><a class="button" href="unpop://setup">Unpop으로 돌아가기</a></p>
<p>Unpop의 설정 목록은 저절로 바뀌어요. 그래도 확인되지 않으면 설정 › 앱 › Safari › 확장 프로그램 › Unpop 팝업 차단에서 모든 웹사이트를 ‘허용’으로 바꾼 뒤 이 페이지를 다시 열어 주세요.</p>
